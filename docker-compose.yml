version: "3.9"

services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile.backend
    ports:
      - "8001:8001"
    env_file:
      - ./Backend/.env
    environment:
      VAULTLEARN_DB_PATH: /app/data/sessions.db
    volumes:
      - ./Backend/vault:/app/vault
      - ./Backend/chroma_db:/app/chroma_db
      - vaultlearn_data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  vaultlearn_data:
